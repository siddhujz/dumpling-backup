# Render Blueprint: a cron job that runs one verified backup on Render's schedule and exits.
# Set the three secret variables in the Render dashboard after the first deploy.
services:
  - type: cron
    name: dumpling-backup
    runtime: image
    image:
      url: ghcr.io/siddhujz/dumpling-backup:18 # match your PostgreSQL major: 16, 17 or 18
    schedule: "0 2 * * *" # UTC
    envVars:
      - key: SCHEDULE
        value: once
      - key: DATABASE_URL
        sync: false # paste your database's external connection string
      - key: S3_ENDPOINT
        value: https://<accountid>.r2.cloudflarestorage.com
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: db-backups
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_NAME
        value: app
      - key: KEEP_LAST
        value: "14"
