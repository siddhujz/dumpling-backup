name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The runner image ships PostgreSQL 16 (initdb, pg_ctl, pg_dump); the integration test uses it.
      - run: npm test
        env:
          PGBIN: /usr/lib/postgresql/16/bin
      - run: npm run build
      - name: docker build (pg 18)
        run: docker build --build-arg PG_MAJOR=18 -t dumpling-backup:ci .
      - name: image smoke test (config errors are reported, exit 2)
        run: |
          set +e
          docker run --rm dumpling-backup:ci; code=$?
          set -e
          test "$code" -eq 2
  # The built image against a real PostgreSQL and a real S3 API (MinIO): one backup in `once` mode must
  # exit 0, report "verified", and leave exactly one object; a wrong password must exit 1 and leave none.
  image-e2e:
    runs-on: ubuntu-24.04
    needs: test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pgpass
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg PG_MAJOR=17 -t dumpling-backup:e2e .
      - name: start MinIO and create the bucket (a service container cannot take a command)
        run: |
          docker run -d --name minio --network host -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin minio/minio server /data
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          docker run --rm --network host --entrypoint sh amazon/aws-cli:latest -c \
            "AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin aws --endpoint-url http://127.0.0.1:9000 --region us-east-1 s3 mb s3://backups"
      - name: seed the database
        run: |
          docker run --rm --network host -e PGPASSWORD=pgpass postgres:17 \
            psql -h 127.0.0.1 -U postgres -d app -c "create table t(id serial primary key, v text); insert into t(v) select md5(random()::text) from generate_series(1, 5000);"
      - name: one verified backup, exit 0
        run: |
          docker run --rm --network host \
            -e DATABASE_URL='postgresql://postgres:pgpass@127.0.0.1:5432/app?sslmode=disable' \
            -e S3_ENDPOINT=http://127.0.0.1:9000 -e S3_FORCE_PATH_STYLE=true -e S3_BUCKET=backups \
            -e S3_ACCESS_KEY_ID=minioadmin -e S3_SECRET_ACCESS_KEY=minioadmin \
            -e BACKUP_NAME=app -e SCHEDULE=once dumpling-backup:e2e | tee run.log
          grep -q "Verified: 1 table with data" run.log
          grep -q "^.*OK app:" run.log
      - name: the object is in the bucket and restores with pg_restore
        run: |
          docker run --rm --network host --entrypoint sh amazon/aws-cli:latest -c \
            "AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin aws --endpoint-url http://127.0.0.1:9000 --region us-east-1 s3 ls s3://backups/app/ --recursive" | tee ls.log
          test "$(wc -l < ls.log)" -eq 1
          key=$(awk '{print $4}' ls.log)
          docker run --rm --network host --entrypoint sh amazon/aws-cli:latest -c \
            "AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin aws --endpoint-url http://127.0.0.1:9000 --region us-east-1 s3 cp s3://backups/$key /tmp/x.dump >/dev/null && cat /tmp/x.dump" > app.dump
          docker run --rm -i --network host -e PGPASSWORD=pgpass postgres:17 sh -c \
            "cat > /tmp/app.dump && psql -h 127.0.0.1 -U postgres -d postgres -c 'create database restored' >/dev/null && pg_restore --no-owner -h 127.0.0.1 -U postgres -d restored /tmp/app.dump && psql -h 127.0.0.1 -U postgres -d restored -tAc 'select count(*) from t'" < app.dump | tee count.log
          test "$(tail -1 count.log)" = "5000"
      - name: a wrong password exits 1 and leaves nothing behind
        run: |
          set +e
          docker run --rm --network host \
            -e DATABASE_URL='postgresql://postgres:wrong@127.0.0.1:5432/app?sslmode=disable' \
            -e S3_ENDPOINT=http://127.0.0.1:9000 -e S3_FORCE_PATH_STYLE=true -e S3_BUCKET=backups \
            -e S3_ACCESS_KEY_ID=minioadmin -e S3_SECRET_ACCESS_KEY=minioadmin \
            -e BACKUP_NAME=bad -e SCHEDULE=once dumpling-backup:e2e; code=$?
          set -e
          test "$code" -eq 1
          docker run --rm --network host --entrypoint sh amazon/aws-cli:latest -c \
            "AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin aws --endpoint-url http://127.0.0.1:9000 --region us-east-1 s3 ls s3://backups/bad/ --recursive" | tee bad.log || true
          test ! -s bad.log
