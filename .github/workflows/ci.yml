name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The runner image ships PostgreSQL 16 (initdb, pg_ctl, pg_dump); the integration test uses it.
      - run: npm test
        env:
          PGBIN: /usr/lib/postgresql/16/bin
      - run: npm run build
      - name: docker build (pg 18)
        run: docker build --build-arg PG_MAJOR=18 -t dumpling-backup:ci .
      - name: image smoke test (config errors are reported, exit 2)
        run: |
          set +e
          docker run --rm dumpling-backup:ci; code=$?
          set -e
          test "$code" -eq 2
  # The built image against a real PostgreSQL and an S3 API (s3rver, already a dev dependency, so no
  # third-party image to pull): one backup in `once` mode must exit 0, report "verified", and leave
  # exactly one object that pg_restore loads with every row; a wrong password must exit 1 and leave none.
  image-e2e:
    runs-on: ubuntu-24.04
    needs: test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pgpass
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker build --build-arg PG_MAJOR=17 -t dumpling-backup:e2e .
      - name: start a fake S3 on the host
        run: |
          mkdir -p /tmp/s3
          (npx s3rver -d /tmp/s3 --address 0.0.0.0 --port 4568 --configure-bucket backups > s3rver.log 2>&1 &)
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:4568/ && break; sleep 1; done
          curl -s -o /dev/null -w "s3rver answers: %{http_code}\n" http://127.0.0.1:4568/
      - name: seed the database
        run: |
          docker run --rm --network host -e PGPASSWORD=pgpass postgres:17 \
            psql -h 127.0.0.1 -U postgres -d app -c "create table t(id serial primary key, v text); insert into t(v) select md5(random()::text) from generate_series(1, 5000);"
      - name: one verified backup, exit 0
        run: |
          docker run --rm --network host \
            -e DATABASE_URL='postgresql://postgres:pgpass@127.0.0.1:5432/app?sslmode=disable' \
            -e S3_ENDPOINT=http://127.0.0.1:4568 -e S3_FORCE_PATH_STYLE=true -e S3_BUCKET=backups \
            -e S3_ACCESS_KEY_ID=S3RVER -e S3_SECRET_ACCESS_KEY=S3RVER \
            -e BACKUP_NAME=app -e SCHEDULE=once dumpling-backup:e2e | tee run.log
          grep -q "Verified: 1 table with data" run.log
          grep -q " OK app:" run.log
      - name: exactly one object, and it restores with every row
        run: |
          ls -la /tmp/s3/backups/app/
          test "$(ls /tmp/s3/backups/app/ | grep -c '\._S3rver_object$')" -eq 1
          cp /tmp/s3/backups/app/*._S3rver_object app.dump
          docker run --rm -i --network host -e PGPASSWORD=pgpass postgres:17 sh -c \
            "cat > /tmp/app.dump && psql -q -h 127.0.0.1 -U postgres -d postgres -c 'create database restored' && pg_restore --no-owner -h 127.0.0.1 -U postgres -d restored /tmp/app.dump && psql -h 127.0.0.1 -U postgres -d restored -tAc 'select count(*) from t'" < app.dump | tee count.log
          test "$(tail -1 count.log)" = "5000"
      - name: a wrong password exits 1 and leaves nothing behind
        run: |
          set +e
          docker run --rm --network host \
            -e DATABASE_URL='postgresql://postgres:wrong@127.0.0.1:5432/app?sslmode=disable' \
            -e S3_ENDPOINT=http://127.0.0.1:4568 -e S3_FORCE_PATH_STYLE=true -e S3_BUCKET=backups \
            -e S3_ACCESS_KEY_ID=S3RVER -e S3_SECRET_ACCESS_KEY=S3RVER \
            -e BACKUP_NAME=bad -e SCHEDULE=once dumpling-backup:e2e; code=$?
          set -e
          test "$code" -eq 1
          test -z "$(ls -A /tmp/s3/backups/bad 2>/dev/null)"
